name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: 后端单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: pytest（单元层；e2e 需要本机基础设施，CI 跳过）
        run: python -m pytest -m "not e2e" -v

  frontend:
    name: 前端静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 语法检查（node --check 全部 js）
        run: |
          set -e
          for f in frontend/js/*.js frontend/js/pages/*.js; do
            node --check "$f"
          done
      - name: 词法器自测（18 项）
        working-directory: frontend
        run: node tools/selftest-js-lex.mjs
      - name: 块注释配平扫描
        working-directory: frontend
        run: node tools/scan-block-comments.mjs
      - name: 前后端契约核对（路径与方法）
        working-directory: frontend
        run: node check-api-contract.mjs
      - name: DOM id 交叉核对
        working-directory: frontend
        run: node tools/check-dom-ids.mjs
