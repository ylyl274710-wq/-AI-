[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# NOTE: database url is read from app.core.config.settings in alembic/env.py,
# so it is intentionally left empty here to avoid maintaining it in two places.
# IMPORTANT: keep this file pure ASCII. Alembic reads it with
# encoding="locale", which is GBK on Chinese Windows and would raise
# UnicodeDecodeError on any non-ASCII byte.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
